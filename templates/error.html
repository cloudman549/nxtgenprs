{% extends "base.html" %}
{% block title %}Error {{ status }} - {{ config.APP_NAME }}{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card auth-card center">
    <h1 class="error-code">{{ status }}</h1>
    <p class="muted">{{ message }}</p>
    {% if is_admin %}
      <a href="{{ url_for('admin_panel') }}" class="btn btn-primary">Back to admin panel</a>
    {% elif current_user %}
      <a href="{{ url_for('index') }}" class="btn btn-primary">Back to home</a>
    {% else %}
      <a href="{{ url_for('login') }}" class="btn btn-primary">Sign in</a>
    {% endif %}
  </div>
</div>
{% endblock %}
