{% extends "base.html" %}
{% block title %}Sign Up - {{ config.APP_NAME }}{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card auth-card">
    <div class="auth-logo" aria-hidden="true">&#128101;</div>
    <h1 class="auth-title">Create Account</h1>
    <p class="muted auth-sub">Join {{ config.APP_NAME }}</p>

    {% if error %}
      <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="post" action="{{ url_for('signup') }}" class="form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="field">
        <span>Username</span>
        <input type="text" name="username" required minlength="3" maxlength="30" autocomplete="username" placeholder="3-30 characters">
      </label>
      <label class="field">
        <span>Email</span>
        <input type="email" name="email" required autocomplete="email" placeholder="you@example.com">
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" name="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters">
      </label>
      <button type="submit" class="btn btn-primary btn-block">Create account</button>
    </form>

    <p class="muted center">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
  </div>
</div>
{% endblock %}
